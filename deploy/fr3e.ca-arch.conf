# Short link for the bootstrap script:  curl -L fr3e.ca/arch | bash
#
# Apache: put this inside the fr3e.ca <VirtualHost> (or in the site's
# .htaccess, which needs mod_alias and AllowOverride FileInfo), then reload:
#   apachectl configtest && systemctl reload apache2
#
# A redirect (instead of copying the file) means fr3e.ca/arch always serves the
# latest bootstrap.sh from GitHub. 302 so browsers/curl never cache it forever.
Redirect 302 /arch https://raw.githubusercontent.com/fr3e1/arch-autoinstaller/main/bootstrap.sh

# nginx equivalent:
#   location = /arch { return 302 https://raw.githubusercontent.com/fr3e1/arch-autoinstaller/main/bootstrap.sh; }
