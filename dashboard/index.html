<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<title>Arch Autoinstaller</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/css/xterm.min.css">
<style>
/* Design system (ui-ux-pro-max): Minimalism & Swiss style, "code dark + run green".
   JetBrains Mono for headings and code, IBM Plex Sans for body text. */
:root {
  --bg: #0f172a; --surface: #1b2336; --surface-2: #232c41; --line: #2c3650; --border: #475569;
  --fg: #f8fafc; --muted: #94a3b8; --accent: #22c55e; --on-accent: #0f172a; --accent-soft: rgb(34 197 94 / .12);
  --danger: #ef4444; --danger-soft: rgb(239 68 68 / .1); --warn: #f59e0b; --warn-soft: rgb(245 158 11 / .1);
  --ring: #f8fafc; --term-bg: #0b1120;
  --mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --sans: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --r: 10px; --r-sm: 7px; --ease: cubic-bezier(.2, .7, .2, 1);
}
@media (prefers-color-scheme: light) {
  :root {
    --bg: #f8fafc; --surface: #ffffff; --surface-2: #f1f5f9; --line: #e2e8f0; --border: #94a3b8;
    --fg: #0f172a; --muted: #475569; --accent: #15803d; --on-accent: #ffffff; --accent-soft: rgb(21 128 61 / .1);
    --danger: #dc2626; --warn: #b45309; --ring: #0f172a;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 16px/1.55 var(--sans); -webkit-font-smoothing: antialiased; }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--ring); outline-offset: 2px; }
svg.i { width: 18px; height: 18px; flex: none; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.mono { font-family: var(--mono); }
.muted { color: var(--muted); }
[hidden] { display: none !important; }

/* ---------- shell ---------- */
.top { display: flex; align-items: center; gap: 14px; padding: 14px 24px; border-bottom: 1px solid var(--line); flex-wrap: wrap; min-height: 57px; }
.brand { display: flex; align-items: center; gap: 10px; font: 600 15px var(--mono); letter-spacing: -.01em; }
.brand svg { width: 24px; height: 24px; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; margin-left: auto; }
.chip { font: 500 12px var(--mono); padding: 3px 9px; border-radius: 99px; border: 1px solid var(--line); color: var(--muted); white-space: nowrap; }
.chip.ok { color: var(--accent); border-color: color-mix(in srgb, var(--accent) 40%, transparent); }
.chip.warn { color: var(--warn); border-color: color-mix(in srgb, var(--warn) 40%, transparent); }

.app { display: grid; grid-template-columns: 248px minmax(0, 1fr); max-width: 1120px; margin: 0 auto; min-height: calc(100vh - 57px); }
nav.steps { padding: 28px 16px 28px 24px; border-right: 1px solid var(--line); position: sticky; top: 0; align-self: start; min-height: calc(100vh - 57px); }
.steps ol { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
.steps ol button { width: 100%; display: flex; align-items: center; gap: 12px; padding: 10px 12px; border: 0; border-radius: var(--r-sm);
  background: none; text-align: left; color: var(--muted); transition: background .2s var(--ease), color .2s var(--ease); min-height: 44px; }
.steps ol button:hover { background: var(--surface); color: var(--fg); }
.steps ol button[aria-current="step"] { background: var(--surface); color: var(--fg); font-weight: 500; }
.steps .num { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; font: 500 12px var(--mono);
  border: 1px solid var(--border); flex: none; transition: all .2s var(--ease); }
.steps .num svg { width: 14px; height: 14px; }
.steps ol button[aria-current="step"] .num { border-color: var(--fg); }
.steps .done .num { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.steps .err .num { border-color: var(--danger); color: var(--danger); }
.presets { margin-top: 28px; padding-top: 20px; border-top: 1px solid var(--line); }
.eyebrow { font: 500 11px var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 0 0 10px; }
.preset-row { display: flex; flex-wrap: wrap; gap: 6px; }

main { padding: 32px 40px 120px; min-width: 0; outline: none; }
.page-head { margin-bottom: 24px; }
.page-head .eyebrow { margin-bottom: 6px; }
h1 { font: 600 26px/1.25 var(--mono); letter-spacing: -.02em; margin: 0 0 6px; text-wrap: balance; }
.page-head p { margin: 0; color: var(--muted); max-width: 60ch; }

/* ---------- fields ---------- */
.field { padding: 18px 0; border-top: 1px solid var(--line); }
.field:first-child { border-top: 0; padding-top: 4px; }
.field > label, .field > .label { display: block; font-weight: 500; margin-bottom: 10px; }
.help { color: var(--muted); font-size: 14px; margin-top: 8px; max-width: 64ch; }
.seg { display: inline-flex; flex-wrap: wrap; gap: 4px; padding: 4px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); }
.seg button { border: 0; background: none; padding: 7px 14px; min-height: 36px; border-radius: var(--r-sm); color: var(--muted);
  font: 500 14px var(--mono); transition: background .18s var(--ease), color .18s var(--ease); }
.seg button:hover { color: var(--fg); }
.seg button[aria-pressed="true"] { background: var(--fg); color: var(--bg); }
input.text { width: 100%; max-width: 420px; padding: 10px 12px; min-height: 44px; border-radius: var(--r-sm); border: 1px solid var(--border);
  background: var(--surface); font-family: var(--mono); font-size: 15px; transition: border-color .18s var(--ease), box-shadow .18s var(--ease); }
input.text:focus { border-color: var(--fg); outline: none; box-shadow: 0 0 0 3px color-mix(in srgb, var(--fg) 15%, transparent); }
.invalid input.text { border-color: var(--danger); }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 8px; }
.cards.wide { grid-template-columns: 1fr; }
.card { display: flex; align-items: center; gap: 12px; text-align: left; padding: 12px 14px; min-height: 56px; border-radius: var(--r);
  border: 1px solid var(--line); background: var(--surface); transition: border-color .18s var(--ease), background .18s var(--ease); }
.card:hover:not([disabled]) { border-color: var(--border); }
.card[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); }
.card[disabled] { opacity: .45; cursor: not-allowed; }
.card .t { display: block; font: 500 14px var(--mono); }
.card .s { display: block; color: var(--muted); font-size: 13px; }
.card .tick { margin-left: auto; color: var(--accent); opacity: 0; transition: opacity .18s; display: flex; }
.card[aria-pressed="true"] .tick { opacity: 1; }
.tags { display: flex; flex-wrap: wrap; gap: 6px; padding: 6px; max-width: 640px; border: 1px solid var(--border); border-radius: var(--r-sm); background: var(--surface); cursor: text; }
.tags:focus-within { border-color: var(--fg); }
.tag { display: inline-flex; align-items: center; gap: 2px; padding: 3px 4px 3px 9px; border-radius: 6px; background: var(--surface-2); font: 13px var(--mono); }
.tag button { border: 0; background: none; color: var(--muted); width: 24px; height: 24px; border-radius: 4px; font-size: 16px; line-height: 1; }
.tag button:hover { color: var(--danger); }
.tags input { flex: 1; min-width: 140px; border: 0; background: none; padding: 5px; font: 14px var(--mono); outline: none; }
.suggest { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; max-width: 640px; }
.suggest button { font: 12px var(--mono); border: 1px dashed var(--border); background: none; color: var(--muted); padding: 4px 9px; border-radius: 6px; min-height: 30px; transition: color .18s; }
.suggest button:hover { color: var(--fg); border-style: solid; }

/* ---------- buttons ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; padding: 0 18px; border-radius: var(--r-sm);
  border: 1px solid var(--border); background: var(--surface); font-weight: 500; font-size: 15px; transition: all .18s var(--ease); white-space: nowrap; }
.btn:hover:not(:disabled) { border-color: var(--fg); }
.btn.small { min-height: 36px; padding: 0 12px; font-size: 13px; }
.btn.small svg.i { width: 15px; height: 15px; }
.btn.primary { background: var(--fg); color: var(--bg); border-color: var(--fg); }
.btn.go { background: var(--accent); color: var(--on-accent); border-color: var(--accent); font-weight: 600; }
.btn.go:hover:not(:disabled) { filter: brightness(1.08); }
.btn.ghost { background: none; border-color: transparent; color: var(--muted); }
.btn.ghost:hover:not(:disabled) { color: var(--fg); border-color: transparent; }
.btn:disabled { opacity: .45; cursor: not-allowed; }

.footer { position: fixed; left: 0; right: 0; bottom: 0; border-top: 1px solid var(--line); background: color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter: blur(8px); padding: 12px 24px calc(12px + env(safe-area-inset-bottom)); z-index: 5; }
.footer-in { max-width: 1120px; margin: 0 auto; display: flex; align-items: center; gap: 12px; padding-left: 248px; }
.footer .count { font: 13px var(--mono); color: var(--muted); }
.footer .spacer { flex: 1; }

/* ---------- review ---------- */
.review { display: grid; gap: 12px; }
.panel { border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); padding: 18px 20px; }
.panel h2 { font: 600 14px var(--mono); margin: 0 0 12px; display: flex; align-items: center; gap: 8px; min-height: 36px; }
.panel h2 .btn { margin-left: auto; }
dl.sum { display: grid; grid-template-columns: minmax(120px, max-content) 1fr; gap: 6px 20px; margin: 0; font-size: 14px; }
dl.sum dt { color: var(--muted); }
dl.sum dd { margin: 0; font-family: var(--mono); overflow-wrap: anywhere; }
.callout { display: flex; gap: 12px; padding: 14px 16px; border-radius: var(--r); font-size: 14px; border: 1px solid; }
.callout svg.i { margin-top: 2px; }
.callout.warn { background: var(--warn-soft); border-color: color-mix(in srgb, var(--warn) 45%, transparent); }
.callout.warn svg.i { color: var(--warn); }
.callout.danger { background: var(--danger-soft); border-color: color-mix(in srgb, var(--danger) 45%, transparent); }
.callout.danger svg.i { color: var(--danger); }
.callout p { margin: 0 0 4px; }
.callout p:last-child { margin: 0; }
.switch { display: flex; align-items: center; gap: 12px; cursor: pointer; min-height: 44px; font-weight: 500; }
.switch input { appearance: none; width: 40px; height: 22px; border-radius: 99px; background: var(--border); position: relative; margin: 0; cursor: pointer; transition: background .2s var(--ease); flex: none; }
.switch input::after { content: ""; position: absolute; top: 3px; left: 3px; width: 16px; height: 16px; border-radius: 50%; background: #fff; transition: transform .2s var(--ease); }
.switch input:checked { background: var(--warn); }
.switch input:checked::after { transform: translateX(18px); }
.pw-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 14px; margin-top: 14px; }
.pw label { display: block; font-size: 14px; font-weight: 500; margin-bottom: 6px; }
.pw .wrap { position: relative; }
.pw input.text { max-width: none; padding-right: 46px; }
.pw .eye { position: absolute; right: 2px; top: 2px; width: 40px; height: 40px; border: 0; background: none; color: var(--muted); border-radius: 6px; display: grid; place-items: center; }
.pw .eye:hover { color: var(--fg); }
pre.plan { margin: 0; max-height: 320px; overflow: auto; font: 12.5px/1.6 var(--mono); white-space: pre-wrap; overflow-wrap: anywhere; color: var(--muted); }
ul.errs { margin: 10px 0 0; padding-left: 18px; color: var(--danger); font-size: 14px; }
ul.errs:empty { display: none; }

/* ---------- terminal view ---------- */
.termview { display: flex; flex-direction: column; height: calc(100vh - 57px); max-width: 1280px; margin: 0 auto; padding: 20px 24px; gap: 12px; }
.termbar { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.status { display: inline-flex; align-items: center; gap: 10px; font: 500 14px var(--mono); }
.dot { width: 9px; height: 9px; border-radius: 50%; background: var(--warn); box-shadow: 0 0 0 4px var(--warn-soft); }
.status.ok .dot { background: var(--accent); box-shadow: 0 0 0 4px var(--accent-soft); }
.status.fail .dot { background: var(--danger); box-shadow: 0 0 0 4px var(--danger-soft); }
.status.run .dot { animation: pulse 1.6s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: .35; } }
.termbar .spacer { flex: 1; }
.term { flex: 1; min-height: 240px; border: 1px solid var(--line); border-radius: var(--r); background: var(--term-bg); padding: 10px 4px 4px 12px; overflow: hidden; }
.term .xterm { height: 100%; }
pre.fallback { margin: 0; height: 100%; overflow: auto; color: #e2e8f0; font: 13px/1.5 var(--mono); white-space: pre-wrap; }
.sendbar { display: flex; gap: 8px; align-items: center; }
.sendbar input.text { max-width: none; flex: 1; }
.term-note { font-size: 13px; color: var(--muted); display: flex; gap: 8px; align-items: center; }
.term-note svg.i { width: 15px; height: 15px; color: var(--warn); }

.toast { position: fixed; left: 50%; bottom: 84px; transform: translate(-50%, 16px); opacity: 0; pointer-events: none; z-index: 20;
  background: var(--fg); color: var(--bg); padding: 10px 16px; border-radius: var(--r-sm); font-size: 14px; transition: all .2s var(--ease); max-width: calc(100% - 32px); }
.toast.show { opacity: 1; transform: translate(-50%, 0); }

@media (max-width: 860px) {
  .app { grid-template-columns: 1fr; }
  nav.steps { border-right: 0; border-bottom: 1px solid var(--line); padding: 8px 12px; position: sticky; top: 0; background: var(--bg); z-index: 4; }
  .steps ol { display: flex; overflow-x: auto; gap: 4px; scrollbar-width: none; }
  .steps ol button { width: auto; padding: 8px 10px; }
  .steps .lbl { display: none; }
  .steps ol button[aria-current="step"] .lbl { display: inline; white-space: nowrap; }
  .presets { display: none; }
  main { padding: 24px 16px 120px; }
  h1 { font-size: 22px; }
  .footer { padding: 10px 16px calc(10px + env(safe-area-inset-bottom)); }
  .footer-in { padding-left: 0; }
  .footer .count { display: none; }
  .termview { padding: 12px; height: calc(100dvh - 57px); }
  .top { padding: 12px 16px; }
}
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition: none !important; animation: none !important; } }
</style>
</head>

<header class="top">
  <div class="brand">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="#1793d1" d="M12 1.5c-.9 2.3-1.5 3.8-2.5 6 .6.7 1.4 1.4 2.6 2.3-1.3-.5-2.2-1.1-2.9-1.7C7.8 11.2 5.7 15 2 21.5c3-1.7 5.2-2.8 7.4-3.2-.1-.4-.2-.9-.1-1.3v-.1c.1-2.3 1.3-4 2.7-3.9 1.4.1 2.4 2.1 2.3 4.4 0 .4-.1.8-.1 1.1 2.1.4 4.3 1.5 7.3 3.1-.6-1.1-1.1-2-1.6-2.9-.8-.6-1.6-1.4-3.3-2.2 1.2.3 2 .6 2.6 1C15.6 9.6 14.4 6.4 12 1.5Z"/></svg>
    arch-autoinstaller
  </div>
  <div class="chips" id="chips"><span class="chip">connecting…</span></div>
</header>

<!-- ============================== wizard ============================== -->
<div class="app" id="wizard">
  <nav class="steps" aria-label="Install steps">
    <ol id="stepList"></ol>
    <div class="presets">
      <div class="eyebrow">Start from a preset</div>
      <div class="preset-row" id="presets"></div>
    </div>
  </nav>
  <main id="main" tabindex="-1"></main>
</div>

<div class="footer" id="footer">
  <div class="footer-in">
    <button class="btn ghost" id="backBtn"><svg class="i"><use href="#i-left"/></svg>Back</button>
    <span class="count" id="stepCount"></span>
    <span class="spacer"></span>
    <button class="btn primary" id="nextBtn">Next</button>
  </div>
</div>

<!-- ============================== terminal ============================== -->
<section class="termview" id="termview" hidden aria-label="Installer terminal">
  <div class="termbar">
    <span class="status run" id="termStatus" role="status"><span class="dot"></span><span id="termStatusText">Installing</span></span>
    <span class="muted mono" id="termTime" style="font-size:13px"></span>
    <span class="spacer"></span>
    <button class="btn small" id="termBack" hidden><svg class="i"><use href="#i-left"/></svg>Back to options</button>
  </div>
  <div class="term" id="term"></div>
  <form class="sendbar" id="sendbar" autocomplete="off">
    <input class="text" id="sendInput" type="password" placeholder="Answer or password, then Enter" aria-label="Send input to the installer">
    <button class="btn small" type="button" id="sendShow" aria-label="Show what you type"><svg class="i"><use href="#i-eye"/></svg></button>
    <button class="btn small primary" type="submit"><svg class="i"><use href="#i-send"/></svg>Send</button>
  </form>
  <div class="term-note"><svg class="i"><use href="#i-alert"/></svg>
    <span>Anything typed here travels unencrypted (plain HTTP) over your network. Typing passwords on the machine itself is safer.</span></div>
</section>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
"use strict";
// Fallback schema for standalone use (opening this file directly). When served
// by server.py the live schema from lib/options.conf replaces it.
// Keep in sync with lib/options.conf (tests/run.sh checks this).
const EMBEDDED_SCHEMA = [
  ["DISK","disk","","Disk","Target disk (erased!)"],
  ["FILESYSTEM","enum","ext4,btrfs,xfs","Disk","Root filesystem"],
  ["ENCRYPT","enum","no,yes","Disk","LUKS2 encryption"],
  ["EFI_SIZE","text","^[0-9]+[MG]$","Disk","EFI partition size"],
  ["SWAP","enum","zram,file,none","Disk","Swap"],

  const problems = installProblems();
  const confirmMissing = config.DISK && !confirmOk();
  $("installBtn").disabled = problems.length > 0 || confirmMissing || !config.DISK;
  const shown = [...problems, ...serverErrors];
  if (confirmMissing && confirmText.trim()) shown.push(`That doesn't match ${config.DISK}.`);
  $("installErrs").replaceChildren(...shown.map((m) => el("li", {}, m)));
}

// ------------------------------------------------------------------ render ---
function renderNav() {
  $("stepList").replaceChildren(...STEPS.map((s, i) => {
    const errs = i < STEPS.length - 1 ? stepErrors(i) : [];
    const cls = i !== step && visited.has(i) && i < STEPS.length - 1 ? (errs.length ? "err" : "done") : "";
    return el("li", {}, el("button", { type: "button", class: cls, "aria-current": i === step ? "step" : false, onclick: () => go(i) },
      el("span", { class: "num" }, cls === "done" ? icon("check") : String(i + 1)), el("span", { class: "lbl" }, s.title)));
  }));
  $("stepCount").textContent = `Step ${step + 1} of ${STEPS.length}`;
  $("backBtn").disabled = step === 0;
  $("nextBtn").hidden = step === STEPS.length - 1;
  $("nextBtn").replaceChildren(step === STEPS.length - 2 ? "Review" : "Next", icon("right"));
}
function render() {
  const s = STEPS[step];
  const scroll = window.scrollY;
  const body = s.id === "review" ? reviewPage() : el("div", {}, schema.filter((o) => s.sections.includes(o.section) && visible(o.key)).map(fieldFor));
  $("main").replaceChildren(el("div", { class: "page-head" }, el("div", { class: "eyebrow" }, `Step ${step + 1} · ${s.title}`),
    el("h1", {}, s.id === "review" ? "Ready to install?" : s.title), el("p", {}, s.lead)), body);
  window.scrollTo(0, scroll);
  if (refocus) { $("main").querySelector(`input[data-key="${refocus}"]`)?.focus(); refocus = null; }
  renderNav();
  updateInstallState();
}
function go(i) {
  step = Math.max(0, Math.min(STEPS.length - 1, i)); visited.add(step); serverErrors = [];
  render(); window.scrollTo(0, 0); $("main").focus({ preventScroll: true });
}
$("backBtn").onclick = () => go(step - 1);
$("nextBtn").onclick = () => go(step + 1);
for (const [name, values] of Object.entries(PRESETS)) {
  $("presets").append(el("button", { type: "button", class: "btn small", onclick: () => { Object.assign(config, values); planText = ""; render(); toast(name + " preset applied"); } }, name));
}

// ----------------------------------------------------------------- actions ---
function configText() {
  const q = (v) => "'" + String(v).replace(/'/g, "'\\''") + "'";
  const lines = ["# arch-autoinstaller config, generated by the web dashboard " + new Date().toISOString().slice(0, 10)];
  let section = "";
  for (const o of schema) {
    if (o.section !== section) { lines.push("", "# --- " + o.section); section = o.section; }
    lines.push(`${o.key}=${q(config[o.key] ?? "")}`);
  }
  return lines.join("\n") + "\n";
}
function download() {
  const a = el("a", { href: URL.createObjectURL(new Blob([configText()], { type: "text/plain" })), download: "config" });
  a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}
async function importFile(e) {
  const file = e.target.files[0]; if (!file) return;
  let n = 0;
  for (const line of (await file.text()).split("\n")) {
    const m = line.match(/^([A-Z_]+)=(?:'((?:[^']|'\\'')*)'|"([^"]*)"|(\S*))\s*$/);
    if (m && m[1] in DEFAULTS) { config[m[1]] = (m[2] ?? "").replace(/'\\''/g, "'") || m[3] || m[4] || ""; n++; }
  }
  if (config.LOCALE.endsWith(" UTF-8")) config.LOCALE = config.LOCALE.slice(0, -6);
  if (config.DISK && !config.DISK.startsWith("/")) config.DISK = "/dev/" + config.DISK;
  toast(`Imported ${n} options`); render();
}
async function checkPlan() {
  $("planBtn").disabled = true; $("planBtn").textContent = "Checking…";
  try {
    const r = await api("/api/plan", { config });
    planText = r.output || (r.errors || []).join("\n");
  } catch (e) { planText = "Failed: " + e.message; }
  render();
}
async function saveOnly() {
  try {
    const r = await api("/api/save", { config });
    toast(r.ok ? "Config saved on the installer" : "Not saved: " + (r.errors || []).join(", "));
  } catch (e) { toast("Save failed: " + e.message); }
}
async function startInstall() {
  $("installBtn").disabled = true;
  const passwords = pw.enabled ? Object.fromEntries([["user", pw.user],
    ...(config.ROOT_PASSWORD_MODE === "prompt" ? [["root", pw.root]] : []),
    ...(config.ENCRYPT === "yes" ? [["luks", pw.luks]] : [])]) : {};
  try {
    const r = await api("/api/install", { config, confirm_disk: confirmText.trim(), passwords });
    if (!r.ok) { serverErrors = r.errors || ["Unknown error"]; updateInstallState(); return; }
    for (const k of Object.keys(pw)) if (k !== "enabled") pw[k] = ""; // forget them in the page
    confirmText = "";
    showTerminal();
  } catch (e) { serverErrors = ["Failed: " + e.message]; updateInstallState(); }
}

// ---------------------------------------------------------------- terminal ---
let term = null, fit = null, fallbackPre = null, offset = 0, polling = false, startedAt = Date.now(), timer = null;
const dec = new TextDecoder();
const stripAnsi = (s) => s.replace(/\x1b\[[0-9;?]*[ -\/]*[@-~]/g, "").replace(/\x1b\][^\x07]*(\x07|\x1b\\)/g, "");
function showTerminal() {
  $("wizard").hidden = true; $("footer").hidden = true; $("termview").hidden = false; $("sendbar").hidden = false;
  if (!term && !fallbackPre) {
    if (window.Terminal) {
      term = new Terminal({ cursorBlink: true, scrollback: 20000, fontSize: 13,
        fontFamily: "'JetBrains Mono', ui-monospace, Menlo, monospace",
        theme: { background: "#0b1120", foreground: "#e2e8f0", cursor: "#22c55e", selectionBackground: "#334155",
          green: "#22c55e", brightGreen: "#4ade80", blue: "#38bdf8", brightBlue: "#7dd3fc", red: "#f87171", yellow: "#fbbf24" } });
      if (window.FitAddon) { fit = new FitAddon.FitAddon(); term.loadAddon(fit); }
      term.open($("term"));
      term.onData((d) => api("/api/term/input", { data: d }).catch(() => {}));
      const doFit = () => { try { fit?.fit(); api("/api/term/resize", { cols: term.cols, rows: term.rows }).catch(() => {}); } catch { /* hidden */ } };
      new ResizeObserver(() => { clearTimeout(doFit.t); doFit.t = setTimeout(doFit, 120); }).observe($("term"));
      doFit(); term.focus();
    } else {
      // No CDN access: plain-text view (colours stripped, \r progress lines collapsed).
      fallbackPre = el("pre", { class: "fallback" }); $("term").append(fallbackPre);
    }
  }
  startedAt = Date.now();
  clearInterval(timer);
  timer = setInterval(() => { const s = Math.floor((Date.now() - startedAt) / 1000); $("termTime").textContent = `${Math.floor(s / 60)}m ${String(s % 60).padStart(2, "0")}s`; }, 1000);
  if (!polling) poll();
}
function writeTerm(bytes) {
  if (term) { term.write(bytes); return; }
  let cur = fallbackPre.textContent;
  for (const part of stripAnsi(dec.decode(bytes, { stream: true })).split(/(\r\n|\r|\n)/)) {
    if (part === "\r") cur = cur.slice(0, cur.lastIndexOf("\n") + 1);
    else if (part === "\n" || part === "\r\n") cur += "\n";
    else cur += part;
  }
  fallbackPre.textContent = cur.slice(-400000);
  fallbackPre.scrollTop = fallbackPre.scrollHeight;
}
function setStatus(kind, text) { $("termStatus").className = "status " + kind; $("termStatusText").textContent = text; }
async function poll() {
  polling = true;
  for (;;) {
    try {
      const r = await api(`/api/term?since=${offset}&wait=1`);
      if (r.error) throw new Error(r.error);
      if (r.data) writeTerm(Uint8Array.from(atob(r.data), (c) => c.charCodeAt(0)));
      offset = r.offset;
      if (r.done) {
        clearInterval(timer);
        if (r.exit_code === 0) setStatus("ok", "Install finished. Remove the USB stick and reboot.");
        else setStatus("fail", `Installer stopped (exit code ${r.exit_code})`);
        $("termBack").hidden = r.exit_code === 0; $("sendbar").hidden = true;
        break;
      }
      setStatus("run", "Installing");
    } catch {
      setStatus("fail", "Connection lost, retrying…");
      await new Promise((res) => setTimeout(res, 2000));
    }
  }
  polling = false;
}
$("sendbar").onsubmit = (e) => {
  e.preventDefault();
  const v = $("sendInput").value; $("sendInput").value = "";
  api("/api/term/input", { data: v + "\r" }).catch(() => toast("Could not send"));
};
$("sendShow").onclick = () => {
  const i = $("sendInput"), show = i.type === "password"; i.type = show ? "text" : "password";
  $("sendShow").replaceChildren(icon(show ? "eyeoff" : "eye"));
  $("sendShow").setAttribute("aria-label", show ? "Hide what you type" : "Show what you type");
};
$("termBack").onclick = () => { $("termview").hidden = true; $("wizard").hidden = false; $("footer").hidden = false; go(STEPS.length - 1); };

// -------------------------------------------------------------------- boot ---
async function boot() {
  try {
    if (location.protocol === "file:") throw new Error("standalone");
    const [s, c, i, st] = await Promise.all([api("/api/schema"), api("/api/config"), api("/api/info"), api("/api/status")]);
    if (Array.isArray(s) && s.length) schema = s;
    config = { ...DEFAULTS, ...c };
    info = i; online = true;
    $("chips").replaceChildren(...[
      el("span", { class: "chip ok" }, "● " + i.hostname),
      el("span", { class: "chip" + (i.boot_mode === "UEFI" ? "" : " warn") }, i.boot_mode),
      el("span", { class: "chip" }, `${i.cpu} · ${i.gpu}${i.virt ? " · " + i.virt : ""}`),
      i.memory ? el("span", { class: "chip" }, (i.memory / 2 ** 30).toFixed(1) + " GiB") : null,
      i.live_iso ? null : el("span", { class: "chip warn" }, "not a live ISO"),
    ].filter(Boolean));
    render();
    if (st.ran) showTerminal();
    return;
  } catch {
    $("chips").replaceChildren(el("span", { class: "chip warn" }, "offline: build a config to download"));
  }
  render();
}
boot();
</script>
</body>
</html>
