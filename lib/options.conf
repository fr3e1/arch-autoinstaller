# Option schema shared by install.sh (validation), the terminal menu and the
# web dashboard server. One option per line:
#   KEY|kind|choices-or-regex|section|label
# kind:  enum  -> choices is a comma separated list
#        text  -> choices is an extended regex the value must match ("" allowed
#                 only when the regex allows it)
#        disk  -> block device path or empty (asked during install)
DISK|disk||Disk|Target disk (erased!)
FILESYSTEM|enum|ext4,btrfs,xfs|Disk|Root filesystem
ENCRYPT|enum|no,yes|Disk|LUKS2 encryption
EFI_SIZE|text|^[0-9]+[MG]$|Disk|EFI partition size
SWAP|enum|zram,file,none|Disk|Swap
SWAP_SIZE|text|^[0-9]+[MG]$|Disk|Swap file size
BOOTLOADER|enum|grub,systemd-boot|Boot|Bootloader
KERNEL|enum|linux,linux-lts,linux-zen,linux-hardened|Boot|Kernel
HOSTNAME|text|^[a-zA-Z0-9]([a-zA-Z0-9-]{0,61}[a-zA-Z0-9])?$|System|Hostname
TIMEZONE|text|^[A-Za-z0-9_+/-]+$|System|Timezone
LOCALE|text|^[A-Za-z0-9_.@-]+( UTF-8)?$|System|Locale
KEYMAP|text|^[A-Za-z0-9_.-]+$|System|Console keymap
USERNAME|text|^([a-z_][a-z0-9_-]{0,31})?$|Users|Username (empty = ask)
USER_SHELL|enum|bash,zsh,fish|Users|User shell
USER_SUDO|enum|yes,no|Users|Sudo for user
ROOT_PASSWORD_MODE|enum|lock,same,prompt|Users|Root password
DESKTOP|enum|none,xfce,gnome,kde,cinnamon,mate,lxqt,budgie,i3,sway,hyprland|Desktop|Desktop environment
DISPLAY_MANAGER|enum|auto,none,sddm,gdm,lightdm,ly|Desktop|Display manager
GPU_DRIVER|enum|auto,none,intel,amd,nvidia,vm|Hardware|GPU driver
MICROCODE|enum|auto,intel,amd,none|Hardware|CPU microcode
AUDIO|enum|pipewire,pulseaudio,none|Hardware|Audio
BLUETOOTH|enum|no,yes|Hardware|Bluetooth
PRINTING|enum|no,yes|Hardware|Printing (CUPS)
NETWORK|enum|networkmanager,iwd,none|Network|Network manager
SSH|enum|no,yes|Network|OpenSSH server
FIREWALL|enum|none,ufw,firewalld|Network|Firewall
MIRROR_COUNTRY|text|^[A-Za-z ,]*$|Packages|Mirror country
PARALLEL_DOWNLOADS|text|^[1-9][0-9]?$|Packages|Parallel downloads
MULTILIB|enum|no,yes|Packages|Multilib repo
AUR_HELPER|enum|none,yay,paru|Packages|AUR helper
ADDITIONAL_PACKAGES|text|^[A-Za-z0-9@._+ -]*$|Packages|Extra packages
ADDITIONAL_SERVICES|text|^[A-Za-z0-9@._: -]*$|Packages|Extra services
REBOOT_WHEN_DONE|enum|no,yes|Finish|Reboot when done
